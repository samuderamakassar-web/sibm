name: Driver Status Staleness Push

on:
  schedule:
    # Tiap 30 menit -- cek kendaraan yang statusnya (operational_vehicle_logs)
    # belum diupdate lebih dari ambang waktu padahal bukan standby. Sengaja TANPA
    # guard anti-double-kirim, sama seperti patroli-push-reminder.yml -- terus
    # muncul selama statusnya belum diupdate.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # buat test manual dari tab Actions

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # PENTING (insiden 24 Sep 2026): firebase-admin@14.x DAN @google-cloud/firestore
          # sekarang mensyaratkan Node >=22 di masing-masing package.json-nya. @google-cloud/firestore
          # terdaftar sebagai OPTIONAL dependency firebase-admin -- npm ci DIAM-DIAM MELEWATI
          # paket optional yang gagal cek engines TANPA membuat npm ci exit non-zero, jadi
          # step "Install dependencies" tetap "sukses" walau modulnya beneran gak kepasang.
          # Baru ketahuan pas script jalan: "Cannot find module '@google-cloud/firestore'".
          # JANGAN turunkan node-version di bawah 22 lagi.

      # npm ci (BUKAN "npm install firebase-admin@X" ad-hoc lagi) -- install DETERMINISTIK dari
      # package-lock.json, firebase-admin sekarang jadi devDependency asli di package.json.
      # Ditemukan 20 Sep 2026: cara lama re-resolve SELURUH dependency tree firebase-admin dari
      # registry tiap kali cron jalan, TANPA lockfile sama sekali utk sub-dependency-nya (mis.
      # @google-cloud/firestore) -- begitu versi baru ter-publish di registry, instalasi bisa
      # pincang (modul hilang) TANPA peringatan apa pun, bikin SEMUA cron gagal serentak
      # "Cannot find module '@google-cloud/firestore'". npm ci hilangkan resiko ini total karena
      # selalu install versi PERSIS yang terkunci di package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Jalankan cek staleness status kendaraan
        run: node scripts/driver-status-staleness.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
