name: Reminder Checklist OB & CS

# 🔴 CRON DIMATIKAN (19 Sep 2026, audit notifikasi) -- script ini nulis ke collection
# notifikasi_checklist_ob, dibaca oleh NotifikasiChecklistListener.tsx yang TERNYATA GAK
# PERNAH dipasang di src/app/layout.tsx sama sekali (beda dari NotifikasiPatroliListener &
# NotifikasiKendaraanListener yang memang dipasang di sana) -- jadi reminder ini sudah
# berbulan-bulan jalan tapi TIDAK PERNAH kelihatan oleh siapa pun. Fungsinya juga sudah
# SEPENUHNYA digantikan scripts/fcm-reminder.mjs (push FCM asli, per-sesi, tiap 30 menit,
# jauh lebih reliable) sejak §30. workflow_dispatch dipertahankan (bukan dihapus filenya)
# cuma buat jaga-jaga/histori, TIDAK dijadwalkan otomatis lagi.
on:
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci (BUKAN "npm install firebase-admin@X" ad-hoc lagi) -- install DETERMINISTIK dari
      # package-lock.json, firebase-admin sekarang jadi devDependency asli di package.json.
      # Ditemukan 20 Sep 2026: cara lama re-resolve SELURUH dependency tree firebase-admin dari
      # registry tiap kali cron jalan, TANPA lockfile sama sekali utk sub-dependency-nya (mis.
      # @google-cloud/firestore) -- begitu versi baru ter-publish di registry, instalasi bisa
      # pincang (modul hilang) TANPA peringatan apa pun, bikin SEMUA cron gagal serentak
      # "Cannot find module '@google-cloud/firestore'". npm ci hilangkan resiko ini total karena
      # selalu install versi PERSIS yang terkunci di package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Jalankan reminder checklist OB
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/checklist-reminder.mjs
