name: Points Deduction (Evaluasi Poin Bulanan)

on:
  schedule:
    # Jam 09:00 WITA (01:00 UTC) tiap hari -- evaluasi kepatuhan HARI
    # KEMARIN (OB checklist, kepatuhan patroli Security, Notifikasi Dadakan)
    # karena datanya baru lengkap/final begitu harinya sudah lewat.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # buat test manual dari tab Actions

jobs:
  evaluasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Versi di-pin persis (bukan "firebase-admin" polos/latest) -- ketemu pas audit notifikasi 19 Sep 2026,
      # beberapa run gagal serentak dalam 1 hari yang dicurigai rilis firebase-admin terbaru yang
      # sempat bermasalah, padahal skrip sendiri tidak ada bug. Update versi ini manual kalau perlu.
      - name: Install dependencies
        run: npm install firebase-admin@14.4.0

      - name: Jalankan evaluasi poin harian
        run: node scripts/points-deduction.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
