name: Inspeksi Fasilitas Reminder

on:
  schedule:
    # ~08:10 WITA tiap hari -- script sendiri yang memutuskan skip weekend & Senin-Rabu
    # (baru benar-benar ngirim reminder mulai Kamis, kasih waktu dulu di awal minggu).
    - cron: "10 0 * * *"
  workflow_dispatch: {} # buat test manual dari tab Actions

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci (install deterministik dari package-lock.json) -- lihat catatan lengkap soal
      # kenapa cara ad-hoc lama ("npm install firebase-admin@X") berbahaya di
      # apar-reminder.yml / analisis_project.md §46.
      - name: Install dependencies
        run: npm ci

      - name: Jalankan reminder inspeksi fasilitas
        run: node scripts/inspeksi-fasilitas-reminder.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
